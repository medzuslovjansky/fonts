name: Deploy Website & Specimen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HarfBuzz CLI & Python tools
        run: |
          sudo apt-get install -y --no-install-recommends libharfbuzz-bin || (sudo apt-get update && sudo apt-get install -y libharfbuzz-bin)
          pip install --no-cache-dir fonttools brotli

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Verify fonts, code & types
        run: yarn verify

      - name: Build website
        run: yarn workspace @interslavic/fonts-website build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
